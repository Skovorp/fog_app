name: Luche
options:
  bundleIdPrefix: com.ilovemaggie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Team `C896A4TZRB` owns the `com.ilovemaggie.svet` bundle ID + the
    # App Store / TestFlight distribution profile (`11598e12-…`) + the
    # Xcode-managed dev profile (`847e2b53-…`, includes the test phones in
    # its ProvisionedDevices). Automatic signing reuses whichever matching
    # profile is already cached in `~/Library/Developer/Xcode/UserData/
    # Provisioning Profiles/` — no Apple-ID round-trip needed until those
    # profiles expire or a new device gets added.
    DEVELOPMENT_TEAM: C896A4TZRB
    CODE_SIGN_STYLE: Automatic

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.1.3"

targets:
  Luche:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Luche
        excludes:
          - "Info.plist"
          - "Luche.entitlements"
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilovemaggie.svet
        PRODUCT_NAME: Luche
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Luche/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Entitlements: Sign in with Apple + increased-memory-limit.
        # Requires a paid Apple Developer Program team (set in settings.base).
        CODE_SIGN_ENTITLEMENTS: Luche/Luche.entitlements
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
